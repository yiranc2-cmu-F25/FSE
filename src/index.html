<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prettier Tailwind Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-gray-100">
    <div
      class="flex w-96 flex-col rounded-lg bg-white p-6 text-center shadow-lg"
    >
      <h1
        class="mb-4 text-3xl font-bold leading-tight tracking-tight text-blue-600"
      >
        Hello World
      </h1>

      <p class="mb-6 text-sm leading-relaxed text-gray-500">
        This is a test page to check Prettier plugin for Tailwind CSS. The
        classes here are intentionally unordered.
      </p>

      <button
        class="rounded-md bg-blue-600 px-6 py-2 font-medium text-white shadow transition duration-200 hover:bg-blue-700"
      >
        Click Me
      </button>

      <div class="mt-8 grid grid-cols-2 gap-4">
        <div
          class="rounded bg-green-200 p-4 text-sm font-semibold text-green-900"
        >
          Box 1
        </div>
        <div class="rounded bg-red-200 p-4 text-sm font-semibold text-red-900">
          Box 2
        </div>
      </div>
    </div>
  </body>
</html>
