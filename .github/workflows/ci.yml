name: CI
on:
  push:
    branches:
      - main
      - iter4/Ander
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: "test-secret"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          if-no-files-found: error

      - name: Add coverage to job summary
        if: ${{ hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node - <<'NODE'
          const s = require('./coverage/coverage-summary.json').total;
          const md = [
            '### Jest Coverage',
            '',
            '|Metric|%|Covered/Total|',
            '|---|---:|---:|',
            `|Branches|${s.branches.pct}|${s.branches.covered}/${s.branches.total}|`,
            `|Functions|${s.functions.pct}|${s.functions.covered}/${s.functions.total}|`,
            `|Lines|${s.lines.pct}|${s.lines.covered}/${s.lines.total}|`,
            `|Statements|${s.statements.pct}|${s.statements.covered}/${s.statements.total}|`,
            ''
          ].join('\n');
          require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          NODE
