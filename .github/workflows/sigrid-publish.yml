name: sigrid-publish
on:
  push:
    branches:
      - "main"

jobs:
  sigridci:
    runs-on: ubuntu-latest
    env:
      SIGRID_CI_TOKEN: ${{ secrets.SIGRID_CI_TOKEN }}
    steps:
      # Forks / personal copies of the repo do not have the Sigrid token.
      - name: Check for Sigrid token
        id: sigrid
        run: |
          if [ -n "$SIGRID_CI_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SIGRID_CI_TOKEN is not configured; Sigrid publish skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out repository
        if: steps.sigrid.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Sigrid CI
        if: steps.sigrid.outputs.enabled == 'true'
        run: "git clone https://github.com/Software-Improvement-Group/sigridci.git sigridci"
      - name: "Run Sigrid CI"
        if: steps.sigrid.outputs.enabled == 'true'
        run: "./sigridci/sigridci/sigridci.py --customer cmusvfse --system f25-fse-sa2 --source . --publish"
      - name: Upload Sigrid CI feedback
        if: steps.sigrid.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sigrid-feedback
          path: sigrid-ci-output/feedback.md
